[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarforge"
version = "0.1.0"
description = "Provenance, style and layout checks and a small gate orchestrator for the ScholarForge demo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yifan Xiao" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["scholarforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
